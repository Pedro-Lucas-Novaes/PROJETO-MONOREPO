name: Monorepo CI Pipeline

on:
  # dispara automaticamente ao enviar novos commits para a branch main
  push:
    branches:
      - main
  # dispara na abertura ou atualização de pull requests direcionados para a branch main
  pull_request:
    branches:
      - main
  # permite execução manual pelo painel web do github (aba Actions -> Run workFlow)
  workflow_dispatch:

jobs:
  validar-monorepo:
    name: Validar Backend, Frontend e Docker
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código fonte
        uses: actions/checkout@v4

      - name: 2. Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 3. Configurar o Ndoe.js 24 com cache de dependências
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'